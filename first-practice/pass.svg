<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <g fill="#64748B">
    <!-- Padlock Body -->
    <rect x="3" y="11" width="10" height="9" rx="2" />
    
    <!-- Padlock Shackle (Locked/Closed position) -->
    <path d="M5 11V7a3 3 0 0 1 6 0v4h-2V7a1 1 0 0 0-2 0v4H5z" />
    
    <!-- Lock Keyhole (Dark cut-out) -->
    <circle cx="8" cy="14.5" r="1" fill="#FFFFFF" />
    <path d="M7.3 14.5h1.4l.4 3H6.9l.4-3z" fill="#FFFFFF" />
    
    <!-- Key (Inserted into the keyhole from the right side) -->
    <!-- Key Blade/Shaft (Connected into the lock body) -->
    <rect x="8" y="14" width="11" height="2" rx="0.5" />
    
    <!-- Key Teeth/Notches (Extending downwards near the tip) -->
    <path d="M14 16h1.5v2H14zm2.5 0H18v1.5h-1.5z" />
    
    <!-- Key Ring/Bow (Head of the key on the far right) -->
    <circle cx="19.5" cy="15" r="2.5" />
  </g>
  
  <!-- Key Hole Ring Center (Hole in the key bow) -->
  <circle cx="19.5" cy="15" r="1" fill="#FFFFFF" />
</svg>
