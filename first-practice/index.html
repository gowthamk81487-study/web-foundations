<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">  
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <center>
            <div class = "login-title">
            <h1 >Login Form</h1>
            </div>
            <div class = "login-container">
            <h2>Enter your credentials to login</h2>
            </div>
            <div class = "login-form">
        <form action = "#" method = "get">
            <img src="user.svg" id="usersvg">
                    <input type = "email" name = "Email" id = "Email" required placeholder="UserID">
                    <hr style="width: 100%; height: 1.5px; background-color: black; border: none;">
                    <img src="pass.svg" id="passsvg">
                     <input type = "password" name = "Password" id = "Password" required placeholder="Password">
                    <hr style="width: 100%; height: 1.5px; background-color: black; border: none;">
                <input type = "submit" value = "Login" id="submit-btn">
      
       </form>
            </div>
        </center>
    </body>
</html>
